<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="shortcut icon" href="/assets/images/company_icon.jpg" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f0f2f5; /* Light grey background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        #form-container {
            background-color: #fff; /* White form background */
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        #form-title h1 {
            color: #00bcd4; /* Cyan for title */
            text-align: center;
            margin-bottom: 30px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .input-group-text {
            background-color: #e0f7fa; /* Light cyan for icon background */
            border-color: #00bcd4; /* Cyan border for icon */
            color: #00bcd4; /* Cyan icon color */
            border-right: none;
        }
        .form-floating > .form-control {
            border-left: none;
            border-color: #ced4da;
        }
        .form-floating > .form-control:focus {
            border-color: #00bcd4; /* Cyan border on focus */
            box-shadow: 0 0 0 0.25rem rgba(0, 188, 212, 0.25); /* Cyan shadow on focus */
        }
        .form-floating > label {
            color: #6c757d; /* Grey label color */
        }
        .btn-primary {
            background-color: #00bcd4; /* Cyan button background */
            border-color: #00bcd4; /* Cyan button border */
            font-weight: 600;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #0097a7; /* Darker cyan on hover */
            border-color: #0097a7;
        }
        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div id="form-container">
        <form id="login-form">
            <div id="form-title">
                <h1>LOGIN</h1>
            </div>
            <div id="form-input">
                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <div class="form-floating">
                        <input type="text" class="form-control" id="code" placeholder="Employee Code">
                        <label for="code">Employee Code</label>
                    </div>
                </div>
                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-key"></i></span>
                    <div class="form-floating">
                        <input type="password" class="form-control" id="password" placeholder="Password">
                        <label for="password">Password</label>
                    </div>
                </div>
            </div>
            <div id="message" class="text-danger"></div>
            <button type="submit" class="btn btn-primary w-100 mt-4" id="login-btn">Login</button>
        </form>
    </div>
    <script src="/assets/modules/shared/api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script src="/assets/modules/auth/login.js"></script>
</body>
</html>
