<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="shortcut icon" href="../assets/images/company_icon.jpg" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <div class="d-flex">
        <!-- Sidebar akan dimuat di sini oleh sidebar.js -->
        <div id="sidebar-display" class="min-vh-100"></div>

        <!-- Konten Utama -->
        <div class="flex-grow-1">
            <!-- Header -->
            <div id="header-display"></div>

            <!-- Area Konten Dashboard -->
            <main class="p-4">
                <div class="row g-4">
                    <!-- Card Karyawan Aktif -->
                    <div class="col-md-6 col-lg-3">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-body d-flex align-items-center">
                                <div class="p-3 bg-primary bg-opacity-10 rounded-3 me-3">
                                    <i class="bi bi-people-fill fs-2 text-primary"></i>
                                </div>
                                <div>
                                    <h6 class="card-subtitle mb-2 text-muted">Karyawan Aktif</h6>
                                    <h4 class="card-title fw-bold">150</h4>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Card Cuti Hari Ini -->
                    <div class="col-md-6 col-lg-3">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-body d-flex align-items-center">
                                <div class="p-3 bg-warning bg-opacity-10 rounded-3 me-3">
                                    <i class="bi bi-calendar-check-fill fs-2 text-warning"></i>
                                </div>
                                <div>
                                    <h6 class="card-subtitle mb-2 text-muted">Cuti Hari Ini</h6>
                                    <h4 class="card-title fw-bold">5</h4>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="content" class="mt-4"></div>
            </main>
        </div>
    </div>

    <script src="/assets/js/shared/config.js"></script>
    <script type="module" src="/assets/js/features/dashboard/dashboard.js"></script>
    <script type="module" src="/assets/js/layout/sidebar.js"></script>
    <script type="module" src="/assets/js/layout/nav.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</html>
