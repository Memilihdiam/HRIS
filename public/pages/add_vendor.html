<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>
    <link rel="shortcut icon" href="/assets/images/company_icon.jpg" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f0f2f5; /* Light grey background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            margin: 0;
        }
        #form-container {
            background-color: #fff; /* White form background */
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        #form-title h1 {
            color: #00bcd4; /* Cyan for title */
            text-align: center;
            margin-bottom: 30px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .input-group-text {
            background-color: #e0f7fa; /* Light cyan for icon background */
            border-color: #00bcd4; /* Cyan border for icon */
            color: #00bcd4; /* Cyan icon color */
            border-right: none;
        }
        .form-floating > .form-control {
            border-left: none;
            border-color: #ced4da;
        }
        .form-floating > .form-control:focus {
            border-color: #00bcd4; /* Cyan border on focus */
            box-shadow: 0 0 0 0.25rem rgba(0, 188, 212, 0.25); /* Cyan shadow on focus */
        }
        .form-floating > label {
            color: #6c757d; /* Grey label color */
        }
        .btn{
            width:500px;
            height:40px;
        }
        .btn-primary {
            background-color: #00bcd4; /* Cyan button background */
            border-color: #00bcd4; /* Cyan button border */
            font-weight: 600;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #0097a7; /* Darker cyan on hover */
            border-color: #0097a7;
        }
        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body class="bg-light">
    <div class="d-flex">
        <!-- <div id="sidebar-display" class="min-vh-100"></div> -->
        <div class="flex-grow-1">
            <div id="header-display"></div>
            <main class="p-4">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Add Vendor</h5>
                    </div>
                    <div class="card-body">
                        <form id="add-form" class="row g-3">
                            <div class="col-md-6">
                                <label for="vendor-code-input" class="form-label">Vendor Code</label>
                                <input type="text" class="form-control" id="company-code-input" placeholder="Enter 3 Character Code (ex 'KWC')" required>
                            </div>
                            <div class="col-md-6">
                                <label for="company-name-input" class="form-label">Company Name</label>
                                <input type="text" class="form-control" id="company-name-input" placeholder="Company Name" required>
                            </div>
                            <div class="col-md-6">
                                <label for="industry-input" class="form-label">Company Industry</label>
                                <select class="form-select" id="industry-input" required></select>
                            </div>
                            <div class="col-md-6">
                                <label for="pic-name-input" class="form-label">Person In Charge</label>
                                <input type="text" class="form-control" id="pic-name-input" placeholder="Person In Charge" required>
                            </div>
                            <div class="col-md-6">
                                <label for="email-input" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email-input" placeholder="@ Email" required>
                            </div>
                            <div class="col-md-6">
                                <label for="telephone-number-input" class="form-label">Telephone Number</label>
                                <input type="tel" class="form-control" id="telephone-number-input" placeholder="Telephone Number" required>
                            </div>
                            <div class="col-12">
                                <label for="address-input" class="form-label">Company Address</label>
                                <textarea class="form-control" id="address-input" placeholder="1234 Main St" required></textarea>
                            </div>
                            <div class="col-md-6">
                                <label for="npwp-input" class="form-label">NPWP</label>
                                <input type="text" class="form-control" id="npwp-input" placeholder="NPWP" required>
                            </div>
                            <div class="col-md-6">
                                <label for="rating-input" class="form-label">Rating</label>
                                <input type="number" class="form-control" id="rating-input" placeholder="Rating" required>
                            </div>
                            <div class="col-md-12 align-items">
                                <label for="status-input" class="form-label">Status</label>
                                <select id="status-input" class="form-select" required>
                                    <option value="">Choose status</option>
                                    <option value="ACTIVE">Activate</option>
                                    <option value="SUSPENDED">Suspended</option>
                                    <option value="BLACKLISTED">Blacklist</option>
                                </select>
                            </div>
                            <div class="col-md-12 text-center">
                                <button type="submit" class="btn btn-primary w-40">Add Employee</button>
                            </div>
                        </form>
                        <div class="row g-3 m-1">
                            <div class="col-md-12 text-center">
                                <button onclick="window.location.href = './vendor.html'" class="btn btn-secondary">Back</button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="/assets/js/shared/config.js"></script>
    <script type="module" src="/assets/js/layout/sidebar.js"></script>
    <script type="module" src="/assets/js/layout/nav.js"></script>
    <script type="module" src="/assets/js/features/vendor/add_vendor.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</html>
